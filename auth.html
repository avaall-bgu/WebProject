<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות והרשמה - חתונה בקליק</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">

    <!-- CSS חיצוני -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">חתונה בקליק 💍</a>
            
            <button class="mobile-menu-btn" aria-label="פתח תפריט">☰</button>

            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">דף הבית</a></li>
                    <li><a href="search-venue.html">חיפוש אולם</a></li>
                    <li><a href="suppliers.html">ספקים</a></li>
                    <li><a href="my-event.html">האירוע שלי</a></li>
                </ul>
            </nav>

            <div class="auth-buttons" id="nav-auth-area">
                <a href="auth.html" class="btn btn-outline nav-auth-btn active">התחברות</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container page-content flex-center">
        <div class="auth-box card card-bordered">
            
            <!-- טופס התחברות -->
            <form id="login-form">
                <h2 class="text-center">התחברות למערכת</h2>
                
                <div class="form-group">
                    <label for="login-email">כתובת אימייל:</label>
                    <input type="email" id="login-email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="login-password">סיסמה:</label>
                    <input type="password" id="login-password" placeholder="הזן סיסמה">
                </div>

                <button type="submit" class="btn btn-dark btn-block">התחבר</button>
                
                <p class="auth-toggle-text text-center" style="margin-top: 15px;">
                    עדיין אין לך חשבון? <button type="button" id="goto-register-btn" class="btn-link">הרשמה מהירה</button>
                </p>
            </form>

            <!-- טופס הרשמה -->
            <form id="register-form" class="hidden">
                <h2 class="text-center">הרשמה למערכת</h2>

                <div class="form-group">
                    <label for="reg-name">שם מלא:</label>
                    <input type="text" id="reg-name" placeholder="ישראל ישראלי">
                </div>

                <div class="form-group">
                    <label for="reg-email">כתובת אימייל:</label>
                    <input type="email" id="reg-email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="reg-password">סיסמה:</label>
                    <input type="password" id="reg-password" placeholder="לפחות 6 תווים">
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">אימות סיסמה:</label>
                    <input type="password" id="reg-confirm-password" placeholder="הזן שוב את הסיסמה">
                </div>

                <button type="submit" class="btn btn-dark btn-block">צור חשבון</button>

                <p class="auth-toggle-text text-center" style="margin-top: 15px;">
                    כבר נרשמת? <button type="button" id="goto-login-btn" class="btn-link">התחבר כאן</button>
                </p>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container text-center">
            <p>&copy; 2026 חתונה בקליק - פרויקט אקדמי</p>
        </div>
    </footer>

    <!-- JavaScript חיצוני -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

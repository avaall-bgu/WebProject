<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חתונה בקליק - חיפוש ספקים</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-box">
                <a href="index.html" class="logo">לוגו | חתונה בקליק</a>
            </div>
            <button class="mobile-menu-btn" aria-label="פתח תפריט">☰</button>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">בית</a></li>
                    <li><a href="search-venue.html">חיפוש אולם</a></li>
                    <li><a href="suppliers.html" class="active">ספקים</a></li>
                    <li><a href="my-event.html">האירוע שלי</a></li>
                </ul>
            </nav>
            <div class="auth-buttons" id="nav-auth-area">
                <a href="auth.html" class="btn btn-outline nav-auth-btn">התחברות</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container page-layout">
        <h1>חיפוש ספקים</h1>

        <!-- Category Filter Tabs -->
        <div class="category-tabs" role="tablist">
            <button class="tab-btn active" data-category="all" role="tab">הכל</button>
            <button class="tab-btn" data-category="photography" role="tab">צלמים</button>
            <button class="tab-btn" data-category="dj" role="tab">DJ / תקליטנים</button>
            <button class="tab-btn" data-category="catering" role="tab">קייטרינג</button>
        </div>

        <!-- Filter Bar Card -->
        <div class="card filter-bar card-bordered">
            <div class="filter-group">
                <label>אזור (אפשר לבחור כמה):</label>
                <div class="checkbox-group-inline">
                    <label><input type="checkbox" name="supplier-region" value="north"> צפון</label>
                    <label><input type="checkbox" name="supplier-region" value="center" checked> מרכז</label>
                    <label><input type="checkbox" name="supplier-region" value="jerusalem"> ירושלים</label>
                    <label><input type="checkbox" name="supplier-region" value="south"> דרום</label>
                </div>
            </div>

            <div class="filter-group">
                <label for="supplier-max-price">מחיר מקסימלי (₪):</label>
                <input type="number" id="supplier-max-price" placeholder="למשל 15,000" min="0">
            </div>
        </div>

        <!-- Suppliers Cards Container (Rendered dynamically via JavaScript) -->
        <section class="results-section">
            <div class="cards-grid" id="suppliers-cards-container">
                <!-- דוגמה לכרטיס ספק כפי שייווצר דינמית ב-JS: -->
                <!--
                <article class="supplier-card card">
                    <div class="card-img-placeholder">תמונה</div>
                    <div class="card-body">
                        <h3>שם הצלם</h3>
                        <p class="supplier-category">צלם | מרכז</p>
                        <p class="supplier-desc">תיאור קצר על הספק והסגנון שלו</p>
                        <p class="supplier-price">מחיר: ₪12,000</p>
                        <button class="btn btn-dark btn-block btn-save-vendor">שמירה לאירוע</button>
                    </div>
                </article>
                -->
            </div>

            <!-- Empty State -->
            <div class="card empty-state hidden" id="suppliers-empty-state">
                <h3>לא נמצאו ספקים בתנאים שבחרתם</h3>
                <p>הצעה: נסו להגדיל את המחיר המקסימלי או לבחור אזורים נוספים.</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container footer-container">
            <p>© 2026 חתונה בקליק | <a href="#">צרו קשר</a></p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

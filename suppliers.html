<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חיפוש ספקים - חתונה בקליק</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">

    <!-- CSS חיצוני -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">חתונה בקליק 💍</a>
            
            <!-- כפתור תפריט מובייל עם אייקון המבורגר ברור -->
            <button class="mobile-menu-btn" aria-label="פתח תפריט">☰</button>

            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">דף הבית</a></li>
                    <li><a href="search-venue.html">חיפוש אולם</a></li>
                    <li><a href="suppliers.html" class="active">ספקים</a></li>
                    <li><a href="my-event.html">האירוע שלי</a></li>
                </ul>
            </nav>

            <div class="auth-buttons" id="nav-auth-area">
                <a href="auth.html" class="btn btn-outline nav-auth-btn">התחברות</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container page-content">
        <div class="page-header text-center">
            <h1>חיפוש ספקים לאירוע</h1>
            <p>מצאו את אנשי המקצוע המובילים ליום המיוחד שלכם</p>
        </div>

        <div class="search-layout">
            <!-- Sidebar Filters -->
            <aside class="search-sidebar">
                <form id="search-suppliers-form" class="card card-bordered">
                    <h3>סינון ספקים</h3>

                    <!-- 1. בחירה מרובה של סוגי ספקים -->
                    <div class="form-group">
                        <label>קטגוריות ספקים:</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="supplier-type" value="photography" checked> צלם</label>
                            <label><input type="checkbox" name="supplier-type" value="dj" checked> DJ / מוזיקה</label>
                            <label><input type="checkbox" name="supplier-type" value="design" checked> עיצוב אירועים</label>
                            <label><input type="checkbox" name="supplier-type" value="catering" id="catering-checkbox"> קייטרינג</label>
                        </div>
                    </div>

                    <!-- 2. שדה מוזמנים לקייטרינג (מוסתר כברירת מחדל, נחשף ב-JS) -->
                    <div class="form-group hidden" id="catering-guests-group">
                        <label for="supplier-guests">מספר מוזמנים לקייטרינג (אופציונלי):</label>
                        <input type="number" id="supplier-guests" placeholder="לדוגמה: 300" min="1">
                    </div>

                    <!-- 3. שדה תאריך -->
                    <div class="form-group">
                        <label for="supplier-date">תאריך האירוע:</label>
                        <input type="date" id="supplier-date">
                    </div>

                    <!-- 4. תקציב מקסימלי -->
                    <div class="form-group">
                        <label for="supplier-max-budget">תקציב מקסימלי לספק (₪):</label>
                        <input type="number" id="supplier-max-budget" placeholder="לדוגמה: 15000" min="0">
                    </div>

                    <button type="submit" class="btn btn-dark btn-block">סינון ספקים</button>
                </form>
            </aside>

            <!-- Results Grid -->
            <section class="search-results-area">
                <div class="results-header">
                    <span id="suppliers-results-count" class="results-count">טוען ספקים...</span>
                </div>

                <div id="suppliers-container" class="grid grid-3">
                    <!-- ה-JavaScript יזריק לכאן את כרטיסי הספקים -->
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container text-center">
            <p>&copy; 2026 חתונה בקליק - פרויקט אקדמי</p>
        </div>
    </footer>

    <!-- JavaScript חיצוני -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
